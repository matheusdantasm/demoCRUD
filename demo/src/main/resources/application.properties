# Nome da aplicacao
spring.application.name=demo

# ===============================
# CONFIGURACAO DO SERVIDOR (AZURE)
# ===============================
# O Azure define a porta via variavel de ambiente PORT
server.port=${PORT:8080}

# ===============================
# CONFIGURACAO DO BANCO H2
# ===============================
spring.datasource.url=jdbc:h2:mem:meubanco
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto do Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Atualiza automaticamente as tabelas
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL no console (opcional)
spring.jpa.show-sql=true

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# Inicializacao SQL
# ===============================
spring.sql.init.mode=always